<div class="card">
  <div class="card-body mt-3">
    <div class="row mb-3 align-items-center">
      <div class="col">
        <div class="d-flex align-items-center mb-2">
          <div class="me-3 px-2 py-1 rounded" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%); color: white;">
            <i class="ti ti-chart-bar" style="font-size: 14px;"></i>
          </div>
          <div>
            <h4 class="mb-0 fw-bold" style="color: #2c3e50; font-size: 18px;">Expiration Forecast</h4>
            <small class="text-muted fw-medium">Visual analytics of upcoming item expirations</small>
          </div>
        </div>
      </div>
      <!-- <div class="col-auto">
        <select class="form-select p-r-35" title="Select">
          <option>Today</option>
          <option selected>Month</option>
          <option>Year</option>
        </select>
      </div> -->
    </div>
    <apx-chart
    [series]="chartOptions.series"
    [chart]="chartOptions.chart"
    [dataLabels]="chartOptions.dataLabels"
    [plotOptions]="chartOptions.plotOptions"
    [yaxis]="chartOptions.yaxis"
    [legend]="chartOptions.legend"
    [fill]="chartOptions.fill"
    [stroke]="chartOptions.stroke"
    [tooltip]="chartOptions.tooltip"
    [xaxis]="chartOptions.xaxis"
  ></apx-chart>
  </div>
</div>
